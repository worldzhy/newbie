# Dependabot configuration for the newbie framework monorepo.
#
# This repo publishes @devbie/newbie, @devbie/newbie-cli, and SDK packages.
# Dependabot watches npm dependencies and GitHub Actions so the framework
# stays current and CVE-clean.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - "dependencies"
    # Group patch-level bumps to reduce PR noise; minor/major stay separate
    # so breaking changes get individual review.
    groups:
      patch-updates:
        update-types:
          - "patch"
      # @nestjs/* packages must move in lockstep — framework peers span the
      # family and partial upgrades break npm ci.
      nestjs:
        patterns:
          - "@nestjs/*"
      # @typescript-eslint/parser and eslint-plugin must stay on the same
      # major; they cross-peer each other.
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
    # Policy: no major upgrades by default. Majors are milestone-driven
    # (CVE / feature need / ecosystem EOL) and executed as verified
    # milestones on dev, never via automated PRs — CI cannot observe
    # behavior-level regressions (changed defaults, family lockstep,
    # cross-repo consumer impact), so a green check is not evidence.
    # Dependabot groups only aggregate patch/minor anyway, so majors
    # arrive as single-package PRs that break lockstep and occupy the
    # open-PR limit, crowding out minor/patch updates.
    # typescript-eslint does not support TypeScript 7 yet
    # (https://github.com/typescript-eslint/typescript-eslint/issues/10940).
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
      time: "05:30"
      timezone: "Asia/Shanghai"
    labels:
      - "ci"
    # Same major policy as the npm ecosystem: actions majors are
    # milestone-driven, never via automated PRs.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
